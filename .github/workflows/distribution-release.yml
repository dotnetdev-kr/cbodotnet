name: Verify and publish downstream SDK distributions
run-name: ${{ format('distribution {0} {1} r{2} publish={3} source={4}/{5} frozen={6}/{7}', inputs.channel || 'verification', inputs.tag || 'sdk-10.0.403', inputs.revision || '1', inputs.publish == true, inputs.source_run_id || '-', inputs.source_run_attempt || '1', inputs.promotion_run_id || '-', inputs.promotion_run_attempt || '1') }}

on:
  pull_request:
    paths:
      - 'scripts/distribution*'
      - 'scripts/downstream*'
      - 'scripts/channel_packages.py'
      - 'scripts/package-*.py'
      - 'scripts/verify-channel-install.sh'
      - 'containers/sdk-runtime.Containerfile'
      - 'releases/distribution-contract.json'
      - 'releases/downstream-status.json'
      - '.github/workflows/distribution-release.yml'
  workflow_dispatch:
    inputs:
      channel:
        description: Complete downstream channel matrix
        required: true
        default: deb-oci
        type: choice
        options: [deb-oci, oci, rpm, aur, archive]
      tag:
        description: Exact qualified SDK release
        required: true
        default: sdk-10.0.403
        type: string
      revision:
        description: Immutable packaging revision
        required: true
        default: '1'
        type: string
      publish:
        description: Publish the complete verified matrix through the protected signing environment
        required: true
        default: false
        type: boolean
      source_run_id:
        description: Optional prior successful native matrix run to resume without rebuilding
        required: false
        default: ''
        type: string
      source_run_attempt:
        description: Exact attempt containing the successful native artifacts
        required: false
        default: '1'
        type: string
      promotion_run_id:
        description: Optional prior run with successfully uploaded frozen signed promotion bytes
        required: false
        default: ''
        type: string
      promotion_run_attempt:
        description: Exact attempt containing the frozen promotion artifact
        required: false
        default: '1'
        type: string

permissions:
  contents: read

concurrency:
  group: downstream-distribution-${{ github.event_name == 'pull_request' && github.event.pull_request.number || (inputs.publish == true && 'release' || format('{0}-{1}-r{2}', inputs.channel || 'verification', inputs.tag || 'sdk-10.0.403', inputs.revision || '1')) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  native_archive:
    if: inputs.channel == 'archive' && inputs.source_run_id == '' && inputs.promotion_run_id == ''
    name: Build branded consumer archive on native ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install public compatibility-source inspection tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rpm rpm2cpio cpio gnupg gpgv binutils
      - name: Test consumer archive and repository controls
        run: |
          python3 scripts/check-repository.py
          python3 -m unittest discover -s tests -p '*_test.py'
      - name: Build the branded archive and run all native offline user spaces
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
          TAG: ${{ inputs.tag }}
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          python3 scripts/consumer-archive-ci.py native --tag "$TAG" --revision "$REVISION" --arch "$ARCH" \
            --workspace "$RUNNER_TEMP/delivery-archive-$ARCH"
          tar -C "$RUNNER_TEMP" -I 'gzip -1' -cf "$RUNNER_TEMP/native-archive-$ARCH.tar.gz" "delivery-archive-$ARCH"
      - name: Retain successful native consumer archive bytes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: downstream-archive-native-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-archive-${{ matrix.arch }}.tar.gz
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - name: Retain small archive diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: downstream-archive-reports-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/delivery-archive-${{ matrix.arch }}/*-report.json
            ${{ runner.temp }}/delivery-archive-${{ matrix.arch }}/report.json
            ${{ runner.temp }}/delivery-archive-${{ matrix.arch }}/build/package-build.json
          retention-days: 30
          if-no-files-found: warn

  publish_archive:
    name: Sign and publish branded consumer archives
    needs: native_archive
    if: always() && inputs.channel == 'archive' && inputs.publish == true && github.repository == 'dotnetdev-kr/cbodotnet' && github.ref == 'refs/heads/main' && (needs.native_archive.result == 'success' || (needs.native_archive.result == 'skipped' && (inputs.source_run_id != '' || inputs.promotion_run_id != '')))
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment: downstream-release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject ambiguous consumer archive recovery modes
        env:
          SOURCE_RUN: ${{ inputs.source_run_id }}
          FROZEN_RUN: ${{ inputs.promotion_run_id }}
        run: test -z "$SOURCE_RUN" || test -z "$FROZEN_RUN"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.promotion_run_id == ''
        with:
          pattern: downstream-archive-native-*-${{ inputs.source_run_id || github.run_id }}-${{ inputs.source_run_id != '' && inputs.source_run_attempt || github.run_attempt }}
          path: ${{ runner.temp }}/archive-received
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id || github.run_id }}
      - name: Install consumer signature and provider inspection tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gnupg gpgv binutils
      - name: Import the approved main-only distribution signing identity
        if: inputs.promotion_run_id == ''
        env:
          DOWNSTREAM_SIGNING_KEY: ${{ secrets.DOWNSTREAM_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$DOWNSTREAM_SIGNING_KEY"
          install -d -m 0700 "$RUNNER_TEMP/archive-gnupg"
          printf 'GNUPGHOME=%s\n' "$RUNNER_TEMP/archive-gnupg" >> "$GITHUB_ENV"
          printf '%s' "$DOWNSTREAM_SIGNING_KEY" | gpg --homedir "$RUNNER_TEMP/archive-gnupg" --batch --import
      - name: Prepare the pinned consumer public verification keyring
        run: gpg --batch --yes --dearmor --output "$RUNNER_TEMP/archive-public.gpg" releases/downstream-signing-key.asc
      - name: Authenticate both native consumer archives and sign the complete matrix
        if: inputs.promotion_run_id == ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REVISION: ${{ inputs.revision }}
          SOURCE_RUN: ${{ inputs.source_run_id || github.run_id }}
          SOURCE_ATTEMPT: ${{ inputs.source_run_id != '' && inputs.source_run_attempt || github.run_attempt }}
        run: |
          python3 scripts/consumer-archive-publish.py stage --received "$RUNNER_TEMP/archive-received" \
            --output "$RUNNER_TEMP/archive-promotion" --tag "$TAG" --revision "$REVISION" \
            --source-run "$SOURCE_RUN" --source-attempt "$SOURCE_ATTEMPT" \
            --signing-key D7D154B4B33C19A82B95B13688135410ACD9C0EA --keyring "$RUNNER_TEMP/archive-public.gpg"
      - name: Validate complete consumer freeze readiness
        id: archive_ready
        if: always() && inputs.promotion_run_id == ''
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/archive-promotion/promotion.json" ]]; then
            python3 scripts/consumer-archive.py verify-bundle --bundle "$RUNNER_TEMP/archive-promotion/bundle-archive" \
              --keyring "$RUNNER_TEMP/archive-public.gpg" >/dev/null
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Freeze signed consumer archive bytes before publication
        if: always() && inputs.promotion_run_id == '' && steps.archive_ready.outputs.ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: downstream-archive-frozen-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/archive-promotion/bundle-archive
            ${{ runner.temp }}/archive-promotion/promotion.json
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Publish the exact frozen branded consumer archive bytes
        if: inputs.promotion_run_id == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/consumer-archive-publish.py publish --promotion "$RUNNER_TEMP/archive-promotion" \
            --keyring "$RUNNER_TEMP/archive-public.gpg"
      - name: Resume original signed consumer archives without importing the private key
        if: inputs.promotion_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          FROZEN_RUN: ${{ inputs.promotion_run_id }}
          FROZEN_ATTEMPT: ${{ inputs.promotion_run_attempt }}
        run: |
          python3 scripts/consumer-archive-publish.py publish --promotion "$RUNNER_TEMP/archive-promotion" \
            --keyring "$RUNNER_TEMP/archive-public.gpg" --frozen-run "$FROZEN_RUN" --frozen-attempt "$FROZEN_ATTEMPT"
      - name: Retain the public consumer archive receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: downstream-archive-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/archive-promotion/archive-publication.json
          retention-days: 30
          if-no-files-found: error
      - name: Remove imported consumer signing material
        if: always() && inputs.promotion_run_id == ''
        run: |
          gpgconf --homedir "$RUNNER_TEMP/archive-gnupg" --kill all || true
          python3 -c 'from pathlib import Path; import os,shutil; p=Path(os.environ["RUNNER_TEMP"])/"archive-gnupg"; assert p.name=="archive-gnupg" and p.parent==Path(os.environ["RUNNER_TEMP"]); shutil.rmtree(p,ignore_errors=True)'

  postverify_archive:
    name: Verify public branded consumer archive on native ${{ matrix.arch }}
    needs: publish_archive
    if: always() && needs.publish_archive.result == 'success'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: downstream-archive-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/archive-publication
      - name: Prepare the pinned public consumer identity
        run: gpg --batch --yes --dearmor --output "$RUNNER_TEMP/archive-public.gpg" releases/downstream-signing-key.asc
      - name: Anonymously receive the signed archive and repeat every native offline user space
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          python3 scripts/consumer-archive-public.py --receipt "$RUNNER_TEMP/archive-publication/archive-publication.json" \
            --arch "$ARCH" --workspace "$RUNNER_TEMP/archive-public-$ARCH" --keyring "$RUNNER_TEMP/archive-public.gpg" \
            --output "$RUNNER_TEMP/published-$ARCH.json"
      - name: Retain actual native public consumer installation reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: downstream-archive-postverify-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/published-${{ matrix.arch }}.json
          retention-days: 30
          if-no-files-found: error

  finalize_archive:
    name: Activate verified branded archive availability and refresh Pages
    needs: [publish_archive, postverify_archive]
    if: always() && needs.publish_archive.result == 'success' && needs.postverify_archive.result == 'success' && github.repository == 'dotnetdev-kr/cbodotnet' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: downstream-archive-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/archive-final-publication
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: downstream-archive-postverify-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/archive-final-results
          merge-multiple: true
      - name: Authenticate signed archive metadata and API-digest-bound public reports before committing availability
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gpg --batch --yes --dearmor --output "$RUNNER_TEMP/archive-public.gpg" releases/downstream-signing-key.asc
          python3 scripts/consumer-archive-status.py --receipt "$RUNNER_TEMP/archive-final-publication/archive-publication.json" \
            --reports-dir "$RUNNER_TEMP/archive-final-results" --keyring "$RUNNER_TEMP/archive-public.gpg" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --write

  native:
    if: (inputs.channel == '' || inputs.channel == 'deb-oci' || inputs.channel == 'oci') && inputs.source_run_id == '' && inputs.promotion_run_id == ''
    name: Install packages and OCI on native ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test repository controls
        run: |
          python3 scripts/check-repository.py
          python3 -m unittest discover -s tests -p '*_test.py'
      - name: Build unchanged SDK packages and execute the full installation matrix
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
          TAG: ${{ inputs.tag || 'sdk-10.0.403' }}
          REVISION: ${{ inputs.revision || '1' }}
          CHANNEL: ${{ inputs.channel || 'deb-oci' }}
        run: |
          set -euo pipefail
          python3 scripts/distribution-ci.py native \
            --tag "$TAG" --revision "$REVISION" --arch "$ARCH" --channel "$CHANNEL" \
            --workspace "$RUNNER_TEMP/delivery-$ARCH"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/native-$ARCH.tar.gz" "delivery-$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: downstream-native-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-${{ matrix.arch }}.tar.gz
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  publish:
    name: Sign, promote and post-verify immutable distributions
    needs: native
    if: always() && (inputs.channel == '' || inputs.channel == 'deb-oci' || inputs.channel == 'oci') && inputs.publish == true && github.repository == 'dotnetdev-kr/cbodotnet' && github.ref == 'refs/heads/main' && (needs.native.result == 'success' || (needs.native.result == 'skipped' && (inputs.source_run_id != '' || inputs.promotion_run_id != '')))
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment: downstream-release
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject ambiguous resume modes
        env:
          SOURCE_RUN: ${{ inputs.source_run_id }}
          PROMOTION_RUN: ${{ inputs.promotion_run_id }}
        run: |
          if [[ -n "$SOURCE_RUN" && -n "$PROMOTION_RUN" ]]; then
            echo 'Choose native source-run recovery or frozen promotion recovery, not both.' >&2
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.promotion_run_id == ''
        with:
          pattern: downstream-native-*-${{ inputs.source_run_id || github.run_id }}-${{ inputs.source_run_id != '' && inputs.source_run_attempt || github.run_attempt }}
          path: ${{ runner.temp }}/received
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id || github.run_id }}
      - name: Install signed repository metadata tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends apt-utils gnupg
      - name: Import only the approved protected-environment signing identity
        if: inputs.promotion_run_id == ''
        env:
          DOWNSTREAM_SIGNING_KEY: ${{ secrets.DOWNSTREAM_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$DOWNSTREAM_SIGNING_KEY"
          install -d -m 0700 "$RUNNER_TEMP/downstream-gnupg"
          printf 'GNUPGHOME=%s\n' "$RUNNER_TEMP/downstream-gnupg" >> "$GITHUB_ENV"
          printf '%s' "$DOWNSTREAM_SIGNING_KEY" | gpg --homedir "$RUNNER_TEMP/downstream-gnupg" --batch --import
          gpg --homedir "$RUNNER_TEMP/downstream-gnupg" --batch --import releases/downstream-signing-key.asc
          gpg --homedir "$RUNNER_TEMP/downstream-gnupg" --batch --export D7D154B4B33C19A82B95B13688135410ACD9C0EA > "$RUNNER_TEMP/downstream-public.gpg"
      - name: Prepare the trusted public keyring for frozen promotion recovery
        if: inputs.promotion_run_id != ''
        run: |
          gpg --batch --yes --dearmor --output "$RUNNER_TEMP/downstream-public.gpg" releases/downstream-signing-key.asc
      - name: Authenticate every source/output/report and freeze signed channel bundles
        id: stage
        if: inputs.promotion_run_id == ''
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt || '1' }}
          CHANNEL: ${{ inputs.channel || 'deb-oci' }}
        run: |
          set -euo pipefail
          python3 scripts/distribution-ci.py promote \
            --received "$RUNNER_TEMP/received" --output "$RUNNER_TEMP/promotion" \
            --signing-key D7D154B4B33C19A82B95B13688135410ACD9C0EA \
            --keyring "$RUNNER_TEMP/downstream-public.gpg" \
            --source-run "$SOURCE_RUN_ID" --source-attempt "$SOURCE_RUN_ATTEMPT" --stage-only --channel "$CHANNEL"
      - name: Check whether complete frozen bundles are ready for durable recovery
        id: freeze_ready
        if: always() && inputs.promotion_run_id == ''
        env:
          CHANNEL: ${{ inputs.channel || 'deb-oci' }}
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/promotion/promotion.json" ]]; then
            python3 -c 'from pathlib import Path; import os,sys; sys.path.insert(0,"scripts"); from downstream_publish import validate_bundle; p=Path(os.environ["RUNNER_TEMP"]); channels=("oci",) if os.environ["CHANNEL"]=="oci" else ("deb","oci"); [validate_bundle(p/"promotion"/("bundle-"+name),p/"downstream-public.gpg") for name in channels]'
            printf 'ready=true\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Freeze signed promotion bytes before publication
        id: freeze_upload
        if: always() && inputs.promotion_run_id == '' && steps.freeze_ready.outputs.ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: downstream-frozen-promotion-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/promotion/bundle-deb/
            ${{ runner.temp }}/promotion/bundle-oci/
            ${{ runner.temp }}/promotion/oci-index.json
            ${{ runner.temp }}/promotion/promotion.json
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Publish and post-verify the exact frozen promotion bytes
        if: inputs.promotion_run_id == '' && steps.freeze_upload.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel || 'deb-oci' }}
        run: |
          python3 scripts/distribution-ci.py publish-staged \
            --promotion "$RUNNER_TEMP/promotion" --keyring "$RUNNER_TEMP/downstream-public.gpg" --channel "$CHANNEL"
      - name: Recover verified frozen promotion bytes and resume publication without re-signing
        if: inputs.promotion_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_RUN: ${{ inputs.promotion_run_id }}
          PROMOTION_ATTEMPT: ${{ inputs.promotion_run_attempt }}
          CHANNEL: ${{ inputs.channel || 'deb-oci' }}
        run: |
          python3 scripts/distribution-ci.py publish-staged \
            --promotion "$RUNNER_TEMP/promotion" --keyring "$RUNNER_TEMP/downstream-public.gpg" \
            --frozen-run "$PROMOTION_RUN" --frozen-attempt "$PROMOTION_ATTEMPT" --channel "$CHANNEL"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: downstream-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/promotion/oci-index.json
            ${{ runner.temp }}/promotion/deb-publication.json
            ${{ runner.temp }}/promotion/oci-publication.json
          retention-days: 30
          if-no-files-found: error
      - name: Remove the imported private signing material
        if: always() && inputs.promotion_run_id == ''
        run: |
          set -euo pipefail
          gpgconf --homedir "$RUNNER_TEMP/downstream-gnupg" --kill all || true
          python3 -c 'from pathlib import Path; import os,shutil; p=Path(os.environ["RUNNER_TEMP"])/"downstream-gnupg"; assert p.name=="downstream-gnupg" and p.parent==Path(os.environ["RUNNER_TEMP"]); shutil.rmtree(p,ignore_errors=True)'

  finalize:
    name: Activate verified distribution availability and refresh Pages
    needs: [publish, postverify]
    if: always() && needs.publish.result == 'success' && needs.postverify.result == 'success' && github.repository == 'dotnetdev-kr/cbodotnet' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: downstream-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/final-publication
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: downstream-postverify-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/final-postverification
          merge-multiple: true
      - name: Authenticate receipts and native results, commit availability, dispatch Pages
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel || 'deb-oci' }}
        run: |
          set -euo pipefail
          channels=()
          if [[ "$CHANNEL" == oci ]]; then channels+=(--channel oci); fi
          python3 scripts/distribution-status.py \
            --publication-dir "$RUNNER_TEMP/final-publication" \
            --reports-dir "$RUNNER_TEMP/final-postverification" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --write "${channels[@]}"

  postverify:
    name: Anonymous digest pull and non-root smoke on ${{ matrix.arch }}
    needs: publish
    if: always() && needs.publish.result == 'success'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: downstream-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication
      - name: Pull the published index by digest with no registry credentials
        env:
          ARCH: ${{ matrix.arch }}
          CHANNEL: ${{ inputs.channel || 'deb-oci' }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/anonymous-docker"
          export DOCKER_CONFIG="$RUNNER_TEMP/anonymous-docker"
          arguments=(--index "$RUNNER_TEMP/publication/oci-index.json" --arch "$ARCH" --output "$RUNNER_TEMP/published-$ARCH.json")
          if [[ "$CHANNEL" != oci ]]; then arguments+=(--deb-receipt "$RUNNER_TEMP/publication/deb-publication.json"); fi
          python3 scripts/distribution-ci.py postverify "${arguments[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: downstream-postverify-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/published-${{ matrix.arch }}.json
          retention-days: 30
          if-no-files-found: error

  native_rpm:
    if: inputs.channel == 'rpm' && inputs.source_run_id == '' && inputs.promotion_run_id == ''
    name: Install RPM packages on native ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test repository controls
        run: |
          python3 scripts/check-repository.py
          python3 -m unittest discover -s tests -p '*_test.py'
      - name: Build and install both RPM distro targets with unchanged SDK bytes
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
          TAG: ${{ inputs.tag }}
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          python3 scripts/rpm-ci.py native --tag "$TAG" --revision "$REVISION" --arch "$ARCH" \
            --workspace "$RUNNER_TEMP/delivery-rpm-$ARCH"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/native-rpm-$ARCH.tar.gz" "delivery-rpm-$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: downstream-rpm-native-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-rpm-${{ matrix.arch }}.tar.gz
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  native_aur:
    if: inputs.channel == 'aur' && inputs.source_run_id == '' && inputs.promotion_run_id == ''
    name: Build and install AUR recipes on native x64
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test repository controls
        run: |
          python3 scripts/check-repository.py
          python3 -m unittest discover -s tests -p '*_test.py'
      - name: Build and install pinned binary recipes in clean Arch Linux
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          python3 scripts/aur-ci.py native --tag "$TAG" --revision "$REVISION" \
            --workspace "$RUNNER_TEMP/delivery-aur-x64"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/native-aur-x64.tar.gz" delivery-aur-x64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: downstream-aur-native-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-aur-x64.tar.gz
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Retain Arch packaging diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: downstream-aur-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/delivery-aur-x64/makepkg-logs/
            ${{ runner.temp }}/delivery-aur-x64/installation-result.json
          retention-days: 14
          if-no-files-found: warn

  publish_rpm:
    name: Sign and publish RPM distributions
    needs: native_rpm
    if: always() && inputs.channel == 'rpm' && inputs.publish == true && github.repository == 'dotnetdev-kr/cbodotnet' && github.ref == 'refs/heads/main' && (needs.native_rpm.result == 'success' || (needs.native_rpm.result == 'skipped' && (inputs.source_run_id != '' || inputs.promotion_run_id != '')))
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment: downstream-release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject ambiguous RPM recovery inputs
        env:
          SOURCE_RUN: ${{ inputs.source_run_id }}
          FROZEN_RUN: ${{ inputs.promotion_run_id }}
        run: test -z "$SOURCE_RUN" || test -z "$FROZEN_RUN"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.promotion_run_id == ''
        with:
          pattern: downstream-rpm-native-*-${{ inputs.source_run_id || github.run_id }}-${{ inputs.source_run_id != '' && inputs.source_run_attempt || github.run_attempt }}
          path: ${{ runner.temp }}/rpm-received
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id || github.run_id }}
      - name: Install RPM signing and repository metadata tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rpm createrepo-c gnupg
      - name: Inspect native common RPM determinism before importing a private key
        if: inputs.promotion_run_id == ''
        run: |
          python3 scripts/rpm-publish.py inspect-common --received "$RUNNER_TEMP/rpm-received" \
            --output "$RUNNER_TEMP/rpm-common-diagnostics"
      - name: Retain small common RPM diagnostics
        if: always() && inputs.promotion_run_id == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: downstream-rpm-common-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rpm-common-diagnostics/
          retention-days: 14
          if-no-files-found: warn
      - name: Import the approved main-only distribution signing identity
        if: inputs.promotion_run_id == ''
        env:
          DOWNSTREAM_SIGNING_KEY: ${{ secrets.DOWNSTREAM_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$DOWNSTREAM_SIGNING_KEY"
          install -d -m 0700 "$RUNNER_TEMP/rpm-gnupg"
          printf 'GNUPGHOME=%s\n' "$RUNNER_TEMP/rpm-gnupg" >> "$GITHUB_ENV"
          printf '%s' "$DOWNSTREAM_SIGNING_KEY" | gpg --homedir "$RUNNER_TEMP/rpm-gnupg" --batch --import
      - name: Prepare the pinned public verification keyring
        run: gpg --batch --yes --dearmor --output "$RUNNER_TEMP/rpm-public.gpg" releases/downstream-signing-key.asc
      - name: Sign RPM payloads and authenticate the complete frozen matrix
        if: inputs.promotion_run_id == ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run_id || github.run_id }}
          SOURCE_ATTEMPT: ${{ inputs.source_run_id != '' && inputs.source_run_attempt || github.run_attempt }}
        run: |
          python3 scripts/rpm-publish.py stage --received "$RUNNER_TEMP/rpm-received" \
            --output "$RUNNER_TEMP/rpm-promotion" --signing-key D7D154B4B33C19A82B95B13688135410ACD9C0EA \
            --keyring "$RUNNER_TEMP/rpm-public.gpg" --source-run "$SOURCE_RUN" --source-attempt "$SOURCE_ATTEMPT"
      - name: Validate readiness for durable RPM recovery
        id: rpm_ready
        if: always() && inputs.promotion_run_id == ''
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/rpm-promotion/promotion.json" ]]; then
            python3 -c 'import os,sys; from pathlib import Path; sys.path.insert(0,"scripts"); from downstream_publish import validate_bundle; p=Path(os.environ["RUNNER_TEMP"]); validate_bundle(p/"rpm-promotion/bundle-rpm",p/"rpm-public.gpg")'
            printf 'ready=true\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Freeze signed RPM publication bytes
        id: rpm_freeze
        if: always() && inputs.promotion_run_id == '' && steps.rpm_ready.outputs.ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: downstream-rpm-frozen-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rpm-promotion/bundle-rpm/
            ${{ runner.temp }}/rpm-promotion/promotion.json
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Publish the exact frozen RPM bytes
        if: inputs.promotion_run_id == '' && steps.rpm_freeze.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/rpm-publish.py publish --promotion "$RUNNER_TEMP/rpm-promotion" --keyring "$RUNNER_TEMP/rpm-public.gpg"
      - name: Recover and publish original signed RPM bytes
        if: inputs.promotion_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          FROZEN_RUN: ${{ inputs.promotion_run_id }}
          FROZEN_ATTEMPT: ${{ inputs.promotion_run_attempt }}
        run: |
          python3 scripts/rpm-publish.py publish --promotion "$RUNNER_TEMP/rpm-promotion" \
            --keyring "$RUNNER_TEMP/rpm-public.gpg" --frozen-run "$FROZEN_RUN" --frozen-attempt "$FROZEN_ATTEMPT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: downstream-rpm-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rpm-promotion/rpm-publication.json
          retention-days: 30
          if-no-files-found: error
      - name: Remove imported RPM private signing material
        if: always() && inputs.promotion_run_id == ''
        run: |
          gpgconf --homedir "$RUNNER_TEMP/rpm-gnupg" --kill all || true
          python3 -c 'import os,shutil; from pathlib import Path; p=Path(os.environ["RUNNER_TEMP"])/"rpm-gnupg"; assert p.parent==Path(os.environ["RUNNER_TEMP"]) and p.name=="rpm-gnupg"; shutil.rmtree(p,ignore_errors=True)'

  postverify_rpm:
    name: Verify public RPM repositories on native ${{ matrix.arch }}
    needs: publish_rpm
    if: always() && needs.publish_rpm.result == 'success'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: downstream-rpm-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rpm-publication
      - name: Install and execute the anonymously downloaded signed RPM repositories
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          python3 scripts/rpm-ci.py postverify --receipt "$RUNNER_TEMP/rpm-publication/rpm-publication.json" \
            --arch "$ARCH" --workspace "$RUNNER_TEMP/rpm-published-$ARCH" --output "$RUNNER_TEMP/published-$ARCH.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: downstream-rpm-postverify-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/published-${{ matrix.arch }}.json
          retention-days: 30
          if-no-files-found: error

  finalize_rpm:
    name: Activate verified RPM availability and refresh Pages
    needs: [publish_rpm, postverify_rpm]
    if: always() && needs.publish_rpm.result == 'success' && needs.postverify_rpm.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: downstream-rpm-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rpm-final-publication
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: downstream-rpm-postverify-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rpm-final-results
          merge-multiple: true
      - name: Authenticate RPM receipts and native results before enabling installation commands
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/distribution-status.py --channel rpm --publication-dir "$RUNNER_TEMP/rpm-final-publication" \
            --reports-dir "$RUNNER_TEMP/rpm-final-results" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --write
