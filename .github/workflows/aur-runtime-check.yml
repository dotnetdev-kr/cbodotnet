name: Check Arch rolling SDK compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: '43 5 * * 1'

permissions:
  contents: read

concurrency:
  group: arch-rolling-compatibility
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify current Arch repositories against the qualified SDK
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 scripts/aur-ci.py native --tag sdk-10.0.403 --revision 1 \
            --workspace "$RUNNER_TEMP/arch-rolling-check"
      - name: Retain compatibility evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arch-rolling-compatibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/arch-rolling-check/report.json
            ${{ runner.temp }}/arch-rolling-check/installation-result.json
            ${{ runner.temp }}/arch-rolling-check/makepkg-logs/
          retention-days: 30
          if-no-files-found: warn
