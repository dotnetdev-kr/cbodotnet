name: Download pages

on:
  workflow_dispatch:
  release:
    types: [published, edited]
  schedule:
    - cron: '23 6 * * *'
  push:
    branches: [main]
    paths:
      - site/**
      - docs/support-lifecycle.md
      - scripts/release-catalog.py
      - scripts/release_catalog.py
      - scripts/release_scorecard.py
      - releases/qualified-builds.json
      - releases/qualified-musl-builds.json
      - releases/archive-status.json
      - releases/downstream-status.json
      - releases/downstream-signing-key.asc
      - scripts/distribution_site.py
      - scripts/cbodotnetup_site.py
      - releases/cbodotnetup-status.json
      - releases/musl-status.json
      - releases/musl-signing-policy.json
      - releases/cbodotnet-apk-2026.rsa.pub
      - scripts/musl_site.py
      - scripts/musl_release.py
      - scripts/musl_contract.py
      - .github/workflows/pages.yml

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Validate public releases and generate download links
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/release-catalog.py --output-dir .build/pages
      - name: Upload static site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .build/pages

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy download site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
