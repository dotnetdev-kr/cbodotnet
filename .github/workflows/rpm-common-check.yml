name: Check native shared RPM reproducibility

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rpm-common-reproducibility
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  native:
    name: Build shared RPM on native ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build only shared selectors in both pinned distro containers
        env:
          ARCH: ${{ matrix.arch }}
        run: python3 scripts/rpm-common-ci.py native --arch "$ARCH" --workspace "$RUNNER_TEMP/common-$ARCH"
      - name: Retain small RPMs and reproducibility diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-common-rpm-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/common-${{ matrix.arch }}/
          retention-days: 14
          if-no-files-found: error

  compare:
    name: Compare exact shared RPM bytes across native architectures
    needs: native
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-common-rpm-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/received-common
      - name: Require the complete byte-identical four-target matrix
        run: |
          python3 scripts/rpm-common-ci.py aggregate --received "$RUNNER_TEMP/received-common" \
            --output "$RUNNER_TEMP/common-comparison.json"
      - name: Retain aggregate comparison evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-common-rpm-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/common-comparison.json
          retention-days: 14
          if-no-files-found: warn
