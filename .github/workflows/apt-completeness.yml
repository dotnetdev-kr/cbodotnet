name: Verify APT package ownership and lifecycle

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact admitted qualified SDK release
        type: string
        required: true
        default: sdk-10.0.403
      revision:
        description: Existing packaging revision to install and restore
        type: string
        required: true
        default: '1'

permissions:
  contents: read

concurrency:
  group: apt-completeness-${{ inputs.tag }}-${{ inputs.revision }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  native:
    name: Native ${{ matrix.arch }} APT package coexistence
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test repository and publication controls
        run: |
          python3 scripts/check-repository.py
          python3 -m unittest discover -s tests -p '*_test.py'
      - name: Install real official packages and exercise both APT distro lifecycles
        env:
          ARCH: ${{ matrix.arch }}
          TAG: ${{ inputs.tag }}
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          python3 scripts/distribution-ci.py native --channel deb \
            --tag "$TAG" --revision "$REVISION" --arch "$ARCH" \
            --workspace "$RUNNER_TEMP/apt-completeness-$ARCH"
      - name: Retain exact native reports and source/package identities
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apt-completeness-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/apt-completeness-${{ matrix.arch }}/deb-*/report.json
            ${{ runner.temp }}/apt-completeness-${{ matrix.arch }}/deb-*/installation-result.json
            ${{ runner.temp }}/apt-completeness-${{ matrix.arch }}/deb-*/package.json
            ${{ runner.temp }}/apt-completeness-${{ matrix.arch }}/deb-*/plan.json
            ${{ runner.temp }}/apt-completeness-${{ matrix.arch }}/deb-*/commands.json
          retention-days: 30
          if-no-files-found: warn
