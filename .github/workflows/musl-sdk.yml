name: Native Alpine musl SDK producer

on:
  workflow_dispatch:
    inputs:
      diagnostic_ptrace:
        description: ARM-only crash capture; source-build SYS_PTRACE, never eligible for release
        type: boolean
        required: true
        default: false

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

concurrency:
  group: musl-sdk-${{ github.repository }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Native Alpine 3.24.4 ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.diagnostic_ptrace && '[{"arch":"aarch64","dotnet_arch":"arm64","runner":"ubuntu-24.04-arm"}]' || '[{"arch":"x64","dotnet_arch":"x64","runner":"ubuntu-24.04"},{"arch":"aarch64","dotnet_arch":"arm64","runner":"ubuntu-24.04-arm"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require trusted exact workflow and fresh run identity
        id: paths
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == dotnetdev-kr/cbodotnet && "$GITHUB_REF" == refs/heads/main ]]
          [[ "$GITHUB_WORKFLOW_SHA" == "$GITHUB_SHA" && $(git rev-parse HEAD) == "$GITHUB_SHA" ]]
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ && "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          {
            echo "MUSL_WORKSPACE=$RUNNER_TEMP/musl-work-${{ matrix.arch }}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            echo "MUSL_DELIVERY=$RUNNER_TEMP/musl-delivery-${{ matrix.arch }}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            echo "MUSL_HOST_REPORTS=$RUNNER_TEMP/musl-host-${{ matrix.arch }}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            echo "MUSL_BUNDLE=$RUNNER_TEMP/musl-bundle-${{ matrix.arch }}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            echo "MUSL_BUILD_ID=$(date -u +%Y%m%d).$GITHUB_RUN_NUMBER"
          } >> "$GITHUB_ENV"

      - name: Prepare native SDK-free host tools and capacity
        timeout-minutes: 25
        run: |
          bash scripts/ci-net10-host.sh prepare --arch '${{ matrix.dotnet_arch }}' \
            --workspace "$MUSL_WORKSPACE" --reports-dir "$MUSL_HOST_REPORTS" --minimum-free-gib 30

      - name: Build original VMR, upstream tests, sources and native Alpine proof
        timeout-minutes: ${{ inputs.diagnostic_ptrace && 30 || 300 }}
        env:
          DIAGNOSTIC_PTRACE: ${{ inputs.diagnostic_ptrace }}
        run: |
          extra=()
          if [[ "$DIAGNOSTIC_PTRACE" == true ]]; then extra+=(--diagnostic-ptrace); fi
          python3 scripts/musl-sdk.py run --arch '${{ matrix.arch }}' \
            --workspace "$MUSL_WORKSPACE" --output-dir "$MUSL_DELIVERY" \
            --host-reports "$MUSL_HOST_REPORTS" --build-id "$MUSL_BUILD_ID" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" "${extra[@]}"
          python3 scripts/musl-sdk.py validate --release-dir "$MUSL_DELIVERY"

      - name: Preserve host failure diagnostics
        if: failure() && steps.paths.outcome == 'success'
        env:
          MUSL_ARCH: ${{ matrix.arch }}
          DIAGNOSTIC_PTRACE: ${{ inputs.diagnostic_ptrace }}
        run: |
          set -euo pipefail
          mkdir -p "$MUSL_DELIVERY/reports/diagnostics/host"
          # The runner user owns the output; sudo is only needed to read dmesg.
          # shellcheck disable=SC2024
          sudo -n dmesg --ctime > "$MUSL_DELIVERY/reports/diagnostics/host/kernel.txt" 2>&1 || true
          for name in core_pattern core_uses_pid yama/ptrace_scope; do
            if [[ -r "/proc/sys/kernel/$name" ]]; then
              printf '%s: ' "$name"
              cat "/proc/sys/kernel/$name"
            fi
          done > "$MUSL_DELIVERY/reports/diagnostics/host/core-policy.txt"
          python3 - <<'PY'
          import importlib.util,json,os,pathlib,shutil,stat,sys
          sys.path.insert(0,'scripts')
          from downstream_release import descriptor,encoded,ordinary_file
          source=pathlib.Path(os.environ['MUSL_WORKSPACE'])/'source'
          target=pathlib.Path(os.environ['MUSL_DELIVERY'])/'reports/diagnostics/host'
          for path in source.glob('core*'):
              mode=path.lstat().st_mode
              if stat.S_ISREG(mode) and path.stat().st_size <= 2*1024**3:
                  with path.open('rb') as stream:
                      header=stream.read(64)
                  if header[:4] == b'\x7fELF' and len(header)==64 and int.from_bytes(header[16:18],'little')==4:
                      shutil.copyfile(path,target/path.name)
          # Keep a successfully compiled SDK available for debugging later test
          # failures. This failed run remains ineligible for source admission.
          build=target.parents[1]/'stages/build.json'
          capture=dict(schemaVersion=1,kind='unqualified-sdk-failure-input',productionQualification=False,
              sourceAdmission=False,status='not-available',runId=os.environ['GITHUB_RUN_ID'],
              runAttempt=os.environ['GITHUB_RUN_ATTEMPT'],projectCommit=os.environ['GITHUB_SHA'])
          if os.environ['DIAGNOSTIC_PTRACE'] != 'true' and build.is_file() and json.loads(build.read_bytes()).get('status')=='passed':
              try:
                  arch=os.environ['MUSL_ARCH']
                  rid='linux-musl-'+('arm64' if arch=='aarch64' else 'x64')
                  spec=importlib.util.spec_from_file_location('failed_sdk_selector','scripts/collect-artifacts.py')
                  collector=importlib.util.module_from_spec(spec); spec.loader.exec_module(collector)
                  sdk,candidates,_=collector.select_sdk(source,'10.0.403',rid,exact_name=True)
                  sdk=ordinary_file(sdk)
                  if sdk.stat().st_size>=2*1024**3: raise ValueError('Diagnostic SDK exceeds its size bound')
                  directory=target/'unqualified-sdk'; directory.mkdir()
                  destination=directory/('unqualified-sdk-'+arch+'.tar.gz')
                  shutil.copyfile(sdk,destination)
                  actual=collector.digest_file(destination)
                  if not all(all(row[key]==actual[key] for key in ('bytes','sha256','sha512')) for row in candidates):
                      raise ValueError('Diagnostic SDK copy differs from the compiled archive')
                  capture.update(status='retained-for-development-only',targetRid=rid,artifact=descriptor(destination))
              except Exception as error:
                  capture['reason']=str(error)
          (target/'unqualified-sdk.json').write_bytes(encoded(capture))
          PY

      - name: Preserve unchanged SDK, corresponding source and complete evidence
        if: always() && steps.paths.outcome == 'success'
        env:
          MUSL_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p "$MUSL_DELIVERY" "$MUSL_BUNDLE"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, tarfile
          root = pathlib.Path(os.environ['MUSL_DELIVERY'])
          destination = pathlib.Path(os.environ['MUSL_BUNDLE'])
          if any(p.is_symlink() for p in root.rglob('*')):
              raise SystemExit('No external symlink is allowed in a producer delivery')
          archive = destination / 'delivery.tar.gz'
          with tarfile.open(archive, 'w:gz', compresslevel=1) as stream:
              stream.add(root, arcname='delivery', recursive=True)
          digest = hashlib.file_digest(archive.open('rb'), 'sha256').hexdigest()
          (destination / 'delivery.tar.gz.sha256').write_text(digest + '  delivery.tar.gz\n')
          validation = root / 'producer-validation.json'
          passed = validation.is_file() and json.loads(validation.read_text()).get('status') == 'passed'
          record = dict(schemaVersion=1, kind='musl-sdk-producer-transport',
              status='passed' if passed else 'failed', sdkVersion='10.0.403', libc='musl',
              architecture=os.environ['MUSL_ARCH'], projectCommit=os.environ['GITHUB_SHA'],
              repository=os.environ['GITHUB_REPOSITORY'], runId=os.environ['GITHUB_RUN_ID'],
              runAttempt=os.environ['GITHUB_RUN_ATTEMPT'], workflow='.github/workflows/musl-sdk.yml',
              bundle=dict(name=archive.name, size=archive.stat().st_size, sha256=digest))
          (destination / 'delivery.json').write_text(json.dumps(record, indent=2) + '\n')
          PY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.paths.outcome == 'success'
        with:
          name: sdk-musl-net10-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.MUSL_BUNDLE }}/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
          overwrite: false
