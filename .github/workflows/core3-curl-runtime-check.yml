name: Probe signed Core3 curl candidate runtime

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Exact native target for the unqualified candidate runtime probe
        type: choice
        options: [debian-13, ubuntu-24.04, fedora-45, rocky-9.8]
        default: debian-13
  push:
    branches: [main]
    paths: [.github/workflows/core3-curl-runtime-check.yml]

permissions:
  contents: read

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch'
    name: Forced CurlHandler on ${{ inputs.variant }} native ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Probe pinned original SDKs and signed unmodified curl candidate offline
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
          VARIANT: ${{ inputs.variant }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 scripts/core3-curl-runtime-probe.py native --arch "$ARCH" --variant "$VARIANT" \
            --workspace "$RUNNER_TEMP/core3-curl-runtime"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: core3-curl-runtime-${{ inputs.variant }}-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/core3-curl-runtime/curl-runtime-observation.json
            ${{ runner.temp }}/core3-curl-runtime/inputs/*/source.json
          retention-days: 30
          if-no-files-found: warn
