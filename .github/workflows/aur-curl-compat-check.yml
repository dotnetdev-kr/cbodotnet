name: Check isolated Arch native HTTP provider

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/aur-curl-compat-check.yml']

permissions:
  contents: read

jobs:
  provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and lint only the separate curl addon in pinned native Arch
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 scripts/aur-ci.py compatibility-native --native-http \
            --workspace "$RUNNER_TEMP/arch-http-provider-check"
      - name: Retain provider diagnostics without an SDK qualification claim
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arch-native-http-provider-only-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/arch-http-provider-check/provider-only-result.json
            ${{ runner.temp }}/arch-http-provider-check/native-http-state.json
            ${{ runner.temp }}/arch-http-provider-check/makepkg-logs/
            ${{ runner.temp }}/arch-http-provider-check/recipes/cbodotnet-compat-curl-rocky8/PKGBUILD
            ${{ runner.temp }}/arch-http-provider-check/recipes/cbodotnet-compat-curl-rocky8/.SRCINFO
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
